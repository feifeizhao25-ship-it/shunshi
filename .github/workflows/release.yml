name: Release

on:
  push:
    tags:
      - "v*"

env:
  FLUTTER_VERSION: "3.29.0"

jobs:
  # ==================== Android 国内版 ====================
  build-android-cn:
    name: Build Android CN
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-cn
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=APP_VARIANT=android-cn

      - name: Build AAB (Play Store)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=APP_VARIANT=android-cn

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-cn-apk
          path: android-cn/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-cn-aab
          path: android-cn/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ==================== Android 海外版 ====================
  build-android-global:
    name: Build Android Global
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-global
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK (release)
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://api.seasonsapp.com/api/v1 \
            --dart-define=APP_VARIANT=android-global

      - name: Build AAB (Play Store)
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://api.seasonsapp.com/api/v1 \
            --dart-define=APP_VARIANT=android-global

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-global-apk
          path: android-global/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-global-aab
          path: android-global/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  # ==================== iOS 国内版 ====================
  build-ios-cn:
    name: Build iOS CN
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-cn
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=${API_BASE_URL} \
            --dart-define=APP_VARIANT=ios-cn

      - name: Archive .app for artifact
        run: |
          mkdir -p ../artifacts/ios-cn
          cp -r build/ios/iphoneos/Runner.app ../artifacts/ios-cn/ 2>/dev/null || \
          echo "Runner.app not found at expected path — check build output"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-cn-app
          path: artifacts/ios-cn/
          retention-days: 14
          if-no-files-found: warn

  # ==================== iOS 海外版 ====================
  build-ios-global:
    name: Build iOS Global
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios-global
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter ${{ env.FLUTTER_VERSION }}
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=API_BASE_URL=https://api.seasonsapp.com/api/v1 \
            --dart-define=APP_VARIANT=ios-global

      - name: Archive .app for artifact
        run: |
          mkdir -p ../artifacts/ios-global
          cp -r build/ios/iphoneos/Runner.app ../artifacts/ios-global/ 2>/dev/null || \
          echo "Runner.app not found at expected path — check build output"

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-global-app
          path: artifacts/ios-global/
          retention-days: 14
          if-no-files-found: warn

  # ==================== 创建 GitHub Release ====================
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android-cn, build-android-global, build-ios-cn, build-ios-global]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release-artifacts

      - name: Generate structured changelog
        id: changelog
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^$TAG$" | head -1)

          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --pretty=format:"%s|||%h" HEAD)
          else
            COMMITS=$(git log --pretty=format:"%s|||%h" "$PREV_TAG"..HEAD)
          fi

          FEATURES=""
          FIXES=""
          OTHERS=""

          while IFS='|||' read -r msg hash; do
            if [[ "$msg" == feat* ]]; then
              FEATURES="$FEATURES\n- $msg ($hash)"
            elif [[ "$msg" == fix* ]]; then
              FIXES="$FIXES\n- $msg ($hash)"
            else
              OTHERS="$OTHERS\n- $msg ($hash)"
            fi
          done <<< "$COMMITS"

          {
            echo "changelog<<EOF"
            [ -n "$FEATURES" ] && echo -e "### ✨ 新功能\n$FEATURES\n"
            [ -n "$FIXES"    ] && echo -e "### 🐛 问题修复\n$FIXES\n"
            [ -n "$OTHERS"   ] && echo -e "### 🔧 其他改动\n$OTHERS"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: "顺时 / SEASONS ${{ github.ref_name }}"
          body: |
            ## 更新内容

            ${{ steps.changelog.outputs.changelog }}

            ---

            ## 下载说明

            | 平台 | 文件 | 用途 |
            |------|------|------|
            | Android 国内版 | `android-cn-apk` | 国内直接安装 |
            | Android 国内版 | `android-cn-aab` | 应用市场上传 |
            | Android 海外版 | `android-global-apk` | 海外直接安装 |
            | Android 海外版 | `android-global-aab` | Google Play 上传 |
            | iOS 国内版 | `ios-cn-app` | 需配合 Xcode 签名 + TestFlight |
            | iOS 海外版 | `ios-global-app` | 需配合 Xcode 签名 + TestFlight |

          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') || contains(github.ref_name, 'alpha') }}
          files: |
            ./release-artifacts/android-cn-apk/*.apk
            ./release-artifacts/android-cn-aab/*.aab
            ./release-artifacts/android-global-apk/*.apk
            ./release-artifacts/android-global-aab/*.aab
