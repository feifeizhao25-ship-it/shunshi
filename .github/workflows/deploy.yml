name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  # ==================== 运行测试 ====================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio httpx

      - name: Run backend tests
        working-directory: backend
        env:
          DATABASE_URL: sqlite:///test.db
          REDIS_URL: redis://localhost
          JWT_SECRET: ci-only-secret-with-at-least-32-characters
          ADMIN_JWT_SECRET: ci-admin-secret-with-at-least-32-characters
          ADMIN_PASSWORD_HASH: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_ENV: testing
        run: |
          python -m compileall -q app
          python -m pytest tests/ -v --tb=short

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install admin dependencies
        run: cd admin && npm ci && npm run build

  # ==================== 构建并推送后端镜像 ====================
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 构建并推送 Web Admin 镜像 ====================
  build-web:
    name: Build & Push Web Admin
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/admin
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./admin
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==================== 部署到生产环境 ====================
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-backend, build-web]
    environment: production
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.30.0"

      - name: Configure kubeconfig
        run: |
          test -n "${{ secrets.KUBE_CONFIG }}" || { echo "::error::KUBE_CONFIG 未配置"; exit 1; }
          mkdir -p "$HOME/.kube"
          printf '%s' "${{ secrets.KUBE_CONFIG }}" | base64 -d > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Create production secrets
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          SHUNSHI_DATABASE_URL: ${{ secrets.SHUNSHI_DATABASE_URL }}
          SHUNSHI_JWT_SECRET: ${{ secrets.SHUNSHI_JWT_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_JWT_SECRET: ${{ secrets.ADMIN_JWT_SECRET }}
          ADMIN_PASSWORD_HASH: ${{ secrets.ADMIN_PASSWORD_HASH }}
          SILICONFLOW_API_KEY: ${{ secrets.SILICONFLOW_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          ALIPAY_APP_ID: ${{ secrets.ALIPAY_APP_ID }}
          ALIPAY_PRIVATE_KEY: ${{ secrets.ALIPAY_PRIVATE_KEY }}
          WECHAT_APP_SECRET: ${{ secrets.WECHAT_APP_SECRET }}
        run: |
          for required in DB_PASSWORD SHUNSHI_DATABASE_URL SHUNSHI_JWT_SECRET JWT_SECRET ADMIN_JWT_SECRET ADMIN_PASSWORD_HASH SILICONFLOW_API_KEY; do
            test -n "${!required}" || { echo "::error::GitHub Secret $required 未配置"; exit 1; }
          done
          kubectl create namespace shunshi --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n shunshi create secret generic shunshi-secret \
            --from-literal=DB_PASSWORD="$DB_PASSWORD" \
            --from-literal=SHUNSHI_DATABASE_URL="$SHUNSHI_DATABASE_URL" \
            --from-literal=SHUNSHI_JWT_SECRET="$SHUNSHI_JWT_SECRET" \
            --from-literal=JWT_SECRET="$JWT_SECRET" \
            --from-literal=ADMIN_JWT_SECRET="$ADMIN_JWT_SECRET" \
            --from-literal=ADMIN_PASSWORD_HASH="$ADMIN_PASSWORD_HASH" \
            --from-literal=SILICONFLOW_API_KEY="$SILICONFLOW_API_KEY" \
            --from-literal=STRIPE_SECRET_KEY="$STRIPE_SECRET_KEY" \
            --from-literal=STRIPE_WEBHOOK_SECRET="$STRIPE_WEBHOOK_SECRET" \
            --from-literal=ALIPAY_APP_ID="$ALIPAY_APP_ID" \
            --from-literal=ALIPAY_PRIVATE_KEY="$ALIPAY_PRIVATE_KEY" \
            --from-literal=WECHAT_APP_SECRET="$WECHAT_APP_SECRET" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Update image tags in K8s manifests
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cd k8s
          # docker/metadata-action is configured with prefix=, so the
          # immutable image tag is the bare seven-character SHA (not sha-<SHA>).
          sed -i.bak "s|shunshi/backend:latest|${{ env.IMAGE_PREFIX }}/backend:${SHORT_SHA}|g" backend-deployment.yaml
          sed -i.bak "s|shunshi/admin:latest|${{ env.IMAGE_PREFIX }}/admin:${SHORT_SHA}|g" admin-deployment.yaml
          rm -f -- ./*.bak
          grep -F "image: ${{ env.IMAGE_PREFIX }}/backend:${SHORT_SHA}" backend-deployment.yaml
          grep -F "image: ${{ env.IMAGE_PREFIX }}/admin:${SHORT_SHA}" admin-deployment.yaml

      - name: Apply Kubernetes manifests
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/postgres-statefulset.yaml
          kubectl apply -f k8s/redis-deployment.yaml
          kubectl apply -f k8s/redis-service.yaml
          kubectl apply -f k8s/backend-deployment.yaml
          kubectl apply -f k8s/backend-service.yaml
          kubectl apply -f k8s/admin-deployment.yaml
          kubectl apply -f k8s/nginx-configmap.yaml
          kubectl apply -f k8s/nginx-deployment.yaml
          kubectl apply -f k8s/ingress.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Wait for rollout
        run: |
          kubectl -n shunshi rollout status deployment/backend --timeout=300s
          kubectl -n shunshi rollout status deployment/admin --timeout=120s
          kubectl -n shunshi rollout status statefulset/postgres --timeout=180s

      - name: Verify deployment
        run: |
          echo "=== Pods ==="
          kubectl -n shunshi get pods
          echo "=== Services ==="
          kubectl -n shunshi get svc
          echo "=== HPA ==="
          kubectl -n shunshi get hpa
