name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Get dependencies
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          $FLUTTER_ROOT/bin/flutter pub get --directory=android-cn

      # === Debug APK ===
      - name: Build debug APK
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          $FLUTTER_ROOT/bin/flutter build apk --debug --directory=android-cn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shunshi-debug-apk
          path: android-cn/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7

      # === Release AAB (Google Play) ===
      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          $FLUTTER_ROOT/bin/flutter build appbundle --release --directory=android-cn

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: shunshi-release-aab
          path: android-cn/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      # === Release APK (Direct Distribution) ===
      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          FLUTTER_ROOT=$(dirname $(dirname $(which flutter)))
          $FLUTTER_ROOT/bin/flutter build apk --release --directory=android-cn

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: shunshi-release-apk
          path: android-cn/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
