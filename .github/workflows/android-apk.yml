name: Build Android APK

on:
  push:
    branches: [main]
  # Run on pull requests that change this workflow, so a fix to the build itself is checked before merge.
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # setup-android@v3 installs 'tools platform-tools' by default. Google stopped serving the old
      # 'tools' package (2026-09), so sdkmanager exits 1 with "Failed to find package 'tools'".
      # Only platform-tools is needed; Flutter/Gradle pull the rest.
      # https://github.com/android-actions/setup-android/issues/537
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd android-cn
          flutter pub get

      - name: Verify canonical Android repositories
        run: |
          if grep -R "maven.aliyun.com" android-cn/android --include='*.gradle' --include='*.gradle.kts'; then
            echo "Domestic Android build must use canonical Google/Maven Central repositories" >&2
            exit 1
          fi

      - name: Build debug APK
        run: |
          cd android-cn
          flutter build apk --debug --target-platform android-arm64 2>&1
          echo "=== Build exit code: $? ==="

      - name: Find APK files
        if: always()
        run: find . -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shunshi-debug-apk
          path: android-cn/build/app/outputs/
          retention-days: 7
          if-no-files-found: warn
