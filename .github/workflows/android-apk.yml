name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get dependencies
        run: |
          cd android-cn
          flutter pub get

      - name: Build debug APK
        run: |
          cd android-cn
          flutter build apk --debug --target-platform android-arm64 --verbose 2>&1 | tail -200

      - name: Find APK files
        if: always()
        run: find android-cn/build -name "*.apk" -type f 2>/dev/null

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shunshi-debug-apk
          path: |
            android-cn/build/app/outputs/flutter-apk/*.apk
            android-cn/build/app/outputs/apk/**/*.apk
          retention-days: 7
          if-no-files-found: warn
