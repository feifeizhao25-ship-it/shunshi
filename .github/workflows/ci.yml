name: CI — Lint + Test + Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  mobile-network-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reject clear-text public mobile API endpoints
        run: python scripts/verify_mobile_network_security.py
      - name: Verify mobile API origin/version contract
        run: python scripts/verify_mobile_api_contract.py

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Lint (ruff)
        run: pip install ruff && ruff check app/ --select=E9,F63,F7,F82
      - name: Test
        env:
          DATABASE_URL: sqlite:///test.db
          REDIS_URL: redis://localhost
          JWT_SECRET: ci-only-secret-with-at-least-32-characters
          ADMIN_JWT_SECRET: ci-admin-secret-with-at-least-32-characters
          ADMIN_PASSWORD_HASH: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          APP_ENV: testing
        run: python -m pytest tests/ -x --tb=short

  flutter-cn:
    needs: mobile-network-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-cn
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - name: Get deps
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://localhost --dart-define=APP_VARIANT=android-cn

  flutter-global:
    needs: mobile-network-security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-global
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - name: Get deps
        run: flutter pub get
      - name: Verify global build uses upstream repositories and declared assets exist
        run: |
          if grep -R "maven.aliyun.com" android --include='*.gradle' --include='*.gradle.kts'; then
            echo "Global build must not depend on CN-only Maven mirrors" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import re
          declared = re.findall(r'^\s+-\s+(assets/\S+)\s*$', Path('pubspec.yaml').read_text(), re.M)
          missing = [p for p in declared if not Path(p).exists()]
          if missing:
              raise SystemExit('Missing Flutter asset directories: ' + ', '.join(missing))
          PY
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://localhost --dart-define=APP_VARIANT=android-global
