name: CI — Lint + Test + Build Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Compile check
        run: python -m compileall -q app
      - name: Lint (ruff)
        run: pip install ruff && ruff check app/ --select=E9,F63,F7,F82
      - name: Test
        env:
          DATABASE_URL: sqlite:///test.db
          REDIS_URL: redis://localhost
          JWT_SECRET: ci-only-secret-with-at-least-32-characters
        run: python -m pytest tests/ -x --tb=short

  flutter-cn:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-cn
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - name: Get deps
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://localhost/api/v1 --dart-define=APP_VARIANT=android-cn

  flutter-global:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-global
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
      - name: Get deps
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-warnings --no-fatal-infos
      - name: Test
        run: flutter test
      - name: Build APK (debug)
        run: flutter build apk --debug --dart-define=API_BASE_URL=http://localhost/api/v1 --dart-define=APP_VARIANT=android-global
