<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="顺时——按二十四节气安排作息。对话由人工智能生成，不是真人，不提供医疗诊断或治疗。">
  <meta name="keywords" content="节气,作息,养生,二十四节气,顺时">
  <meta name="author" content="顺时">

  <!-- Open Graph -->
  <meta property="og:title" content="顺时｜节气作息陪伴">
  <meta property="og:description" content="按二十四节气安排作息。对话由人工智能生成，不是真人。">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_CN">

  <!-- Theme Color -->
  <meta name="theme-color" content="#115363">
  <meta name="msapplication-navbutton-color" content="#115363">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="顺时养生">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>顺时｜节气作息陪伴</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background: #fdf9f4;
    }
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      min-height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Noto Sans SC', sans-serif;
      color: #144227;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    .loading h1 {
      font-size: 2rem;
      margin-bottom: 0.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
    }
    .loading p {
      font-size: 1rem;
      opacity: 0.7;
      margin-bottom: 2rem;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(20, 66, 39, 0.2);
      border-top-color: #144227;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading" id="loading">
    <h1>顺时</h1>
    <p>按节气安排作息</p>
    <div class="spinner"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var el = document.getElementById('loading');
      if (el) el.style.display = 'none';
    });
  </script>
  <script>
    (function () {
      var fit = 'viewport-fit=cover';
      function keepFit() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (meta) {
          if (meta.content.indexOf(fit) === -1) meta.content = meta.content.replace(/\s+$/, '') + ', ' + fit;
        });
      }
      keepFit();
      new MutationObserver(keepFit).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
