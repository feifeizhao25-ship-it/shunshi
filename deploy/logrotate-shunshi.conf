# 顺时 ShunShi logrotate 配置
# 部署: sudo cp logrotate-shunshi.conf /etc/logrotate.d/shunshi
# 测试: logrotate -d /etc/logrotate.d/shunshi

/var/log/shunshi/*.log {
    daily
    rotate 14
    missingok
    notifempty
    compress
    delaycompress
    sharedscripts
    postrotate
        # Docker 容器日志由 docker 自身管理，此处仅处理应用日志
        # 如需重载 nginx:
        # docker compose -f /opt/shunshi/docker-compose.yml exec nginx nginx -s reopen
    endscript
    create 0644 appuser appuser
    dateext
    dateformat -%Y%m%d
}

# Docker 容器 stdout 日志（如果用了 json-file driver）
/var/lib/docker/containers/*/*-json.log {
    daily
    rotate 7
    missingok
    notifempty
    compress
    delaycompress
    copytruncate
    maxsize 50M
    create 0640 root root
}
