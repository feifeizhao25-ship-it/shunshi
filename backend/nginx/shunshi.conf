# ============================================================
# 顺时后端 — Nginx 反向代理配置
# 部署位置: /etc/nginx/conf.d/shunshi.conf
# ============================================================

# HTTP → HTTPS 重定向
server {
    listen 80;
    server_name shunshiapp.com www.shunshiapp.com api.shunshiapp.com;

    # Let's Encrypt ACME challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS — API 后端
server {
    listen 443 ssl http2;
    server_name api.shunshiapp.com;

    # SSL 证书 (Let's Encrypt)
    ssl_certificate     /etc/letsencrypt/live/api.shunshiapp.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shunshiapp.com/privkey.pem;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    # 请求大小限制
    client_max_body_size 20M;

    # 反向代理到 FastAPI
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 超时配置
        proxy_connect_timeout 30s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    # 静态文件
    location /static/ {
        alias /opt/shunshi/backend/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # 健康检查（不记录日志）
    location /health {
        proxy_pass http://127.0.0.1:4000/health;
        access_log off;
    }
}
