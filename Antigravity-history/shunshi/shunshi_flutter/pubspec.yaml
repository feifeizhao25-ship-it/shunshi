name: shunshi_flutter
description: "顺时 - 节气养生陪伴助手"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter

  # 状态管理
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # 网络
  dio: ^5.7.0
  connectivity_plus: ^6.1.1

  # 本地存储
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.3
  sqflite: ^2.4.1
  path: ^1.9.1

  # 订阅
  in_app_purchase: ^3.2.0

  # 通知 & 后台
  flutter_local_notifications: ^18.0.1
  workmanager: ^0.9.0+3

  # 路由
  go_router: ^14.8.1

  # UI 组件
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.6
  video_player: ^2.9.2

  # 工具
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  share_plus: ^10.1.4
  url_launcher: ^6.3.1
  intl: ^0.20.1
  uuid: ^4.5.1
  equatable: ^2.0.7

  # 图标
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.12.0
  sentry_flutter: ^9.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.5
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  freezed: ^2.5.7
  json_serializable: ^6.9.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
