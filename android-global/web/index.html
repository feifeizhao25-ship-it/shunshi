<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="SEASONS helps you live with the 24 solar terms. It is a seasonal rhythm companion, not a medical service.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="seasons">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SEASONS</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Flutter rewrites the viewport to maximum-scale=1, user-scalable=no.
    // Put zoom back. Axe treats the locked viewport as critical.
    (function () {
      function keepViewport() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (meta) {
          var next = meta.content
            .replace(/user-scalable\s*=\s*no/ig, 'user-scalable=yes')
            .replace(/maximum-scale\s*=\s*1(\.0+)?/ig, 'maximum-scale=5.0');
          if (next !== meta.content) meta.content = next;
        });
        document.querySelectorAll('flt-semantics').forEach(function (el) {
          var style = el.style;
          var scrolls = style.overflowY === 'scroll' || style.overflowX === 'scroll' || style.overflow === 'scroll';
          if (scrolls && el.tabIndex < 0) el.tabIndex = 0;
        });
      }
      keepViewport();
      new MutationObserver(keepViewport).observe(document.documentElement, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
