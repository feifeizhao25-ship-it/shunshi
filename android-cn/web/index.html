<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="顺时——按二十四节气安排作息。对话由人工智能生成，不是真人，不提供医疗诊断或治疗。">
  <meta name="theme-color" content="#115363">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="顺时">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>顺时｜节气作息陪伴</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      min-height: 100dvh;
      min-height: -webkit-fill-available;
      background: #fdf9f4;
    }
  </style>
</head>
<body>
  <script>
    // Flutter 启动时会重写 viewport，这里把刘海安全区保留下来。
    (function () {
      var fit = 'viewport-fit=cover';
      function keepFit() {
        document.querySelectorAll('meta[name="viewport"]').forEach(function (meta) {
          if (meta.content.indexOf(fit) === -1) meta.content = meta.content.replace(/\s+$/, '') + ', ' + fit;
        });
      }
      keepFit();
      new MutationObserver(keepFit).observe(document.head, { childList: true, subtree: true, attributes: true, attributeFilter: ['content'] });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
