# 所有对外开放后端的站点共用的路由与限流。区域定义在各站点配置顶部（limit_req_zone）。

# 登录、注册、短信：每个地址每分钟 10 次，防撞库与短信轰炸（后端另有按手机号的限额）。
location /api/v1/auth/ {
    limit_req zone=shunshi_auth burst=5 nodelay;
    include /etc/nginx/snippets/proxy-backend.conf;
}

# 对话：每个地址每分钟 30 次（后端另有按会员档位的每日额度）。
# /ai/chat 是国内客户端对话页使用的旧路径，由后端接到国内对话链路。
location ~ ^/(api/v1/(chat|ai)(/|$)|ai/) {
    limit_req zone=shunshi_ai burst=10 nodelay;
    include /etc/nginx/snippets/proxy-backend.conf;
}

location /api/ {
    limit_req zone=shunshi_api burst=50 nodelay;
    include /etc/nginx/snippets/proxy-backend.conf;
}

# 隐私政策、医疗免责声明等静态页（应用商店审核与客户端都会打开）。
location /static/ {
    include /etc/nginx/snippets/proxy-backend.conf;
    expires 1h;
}
location = /privacy {
    return 301 /static/privacy-policy.html;
}

location = /healthz {
    include /etc/nginx/snippets/proxy-backend.conf;
    access_log off;
}

# 指标只给内网的 Prometheus 直接抓 backend:4000/metrics，不经 nginx 对外。
location /metrics {
    return 404;
}
