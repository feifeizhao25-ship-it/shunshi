# 反代到 FastAPI 后端的公共头。被 conf.d 下的站点配置 include。
proxy_pass http://backend_api;
proxy_http_version 1.1;
proxy_set_header Host $host;
# 后端按 X-Real-IP 做短信等按来源地址的限额；这里用 $remote_addr 覆盖客户端自带的值。
# 如果前面还有云负载均衡，需要在 nginx.conf 里配 set_real_ip_from / real_ip_header，
# 否则所有请求的 $remote_addr 都是负载均衡的地址，按地址的限流会变成全站共用一个桶。
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID $request_id;
proxy_set_header Connection "";
proxy_connect_timeout 10s;
proxy_send_timeout 120s;
proxy_read_timeout 120s;
