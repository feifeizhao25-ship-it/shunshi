# 顺时 ShunShi 国内版 · 生产 HTTPS 站点
#
# 启用方法（都写在仓库根目录的 .env，docker compose 会读取）：
#   SHUNSHI_NGINX_SITE=shunshi-ssl.conf
#   SHUNSHI_WEB_DOMAIN=<已备案的主域名，用户 Web/PWA，例如 shunshi.cn>
#   SHUNSHI_API_DOMAIN=<API 域名，App 调用，例如 api.shunshi.cn>
#   SHUNSHI_ADMIN_DOMAIN=<管理后台域名，例如 admin.shunshi.cn>
#   CN_API_ORIGIN=https://<与 SHUNSHI_API_DOMAIN 相同>
# 证书：backend/docker/ssl/fullchain.pem 与 privkey.pem（compose 挂到 /etc/nginx/ssl），
# 需覆盖以上三个域名。签发时的 HTTP 校验文件放 backend/docker/certbot/。
# 上线前运行：python3 scripts/check_nginx_site.py
#
# nginx 镜像启动时用 envsubst 渲染本文件：只替换已定义的环境变量，$host 等 nginx 变量不受影响。
# 三个域名任何一个没填，nginx 会拒绝启动（server_name 为空或出现未知变量）——这是有意的。

limit_req_zone $binary_remote_addr zone=shunshi_api:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=shunshi_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=shunshi_ai:10m rate=30r/m;
limit_req_status 429;

upstream backend_api {
    least_conn;
    server backend:4000 max_fails=3 fail_timeout=30s;
}

upstream admin_panel {
    server admin:3000 max_fails=3 fail_timeout=30s;
}

upstream web_cn {
    server web-cn:8080 max_fails=3 fail_timeout=30s;
}

ssl_certificate /etc/nginx/ssl/fullchain.pem;
ssl_certificate_key /etc/nginx/ssl/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
ssl_prefer_server_ciphers on;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 10m;

# HTTP → HTTPS；证书签发的 HTTP 校验。
server {
    listen 80;
    server_name ${SHUNSHI_WEB_DOMAIN} ${SHUNSHI_API_DOMAIN} ${SHUNSHI_ADMIN_DOMAIN};

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# 未知域名（含直接用 IP 访问）一律断开，不把任何站点当默认站点暴露出去。
server {
    listen 80 default_server;
    server_name _;
    return 444;
}

server {
    listen 443 ssl http2 default_server;
    server_name _;
    ssl_reject_handshake on;
}

# 用户 Web/PWA（同源访问 /api，免跨域）
server {
    listen 443 ssl http2;
    server_name ${SHUNSHI_WEB_DOMAIN};

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' blob: https:; connect-src 'self' https://${SHUNSHI_API_DOMAIN}; frame-ancestors 'self'" always;

    client_max_body_size 20M;

    include /etc/nginx/snippets/backend-routes.conf;

    location / {
        proxy_pass http://web_cn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# App 调用的 API 域名：只开后端，其余 404。
server {
    listen 443 ssl http2;
    server_name ${SHUNSHI_API_DOMAIN};

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    include /etc/nginx/snippets/backend-routes.conf;

    location / {
        return 404;
    }
}

# 管理后台：单独域名，不挂在用户主站上。
server {
    listen 443 ssl http2;
    server_name ${SHUNSHI_ADMIN_DOMAIN};

    # 强烈建议只放行办公网出口地址（取消注释并填写）：
    # allow 203.0.113.10;
    # deny all;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    client_max_body_size 20M;

    location /api/ {
        limit_req zone=shunshi_api burst=50 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location / {
        proxy_pass http://admin_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
