# 顺时 ShunShi — 生产级 Nginx HTTPS 配置
# 使用方法:
#   1. 申请证书: certbot certonly --nginx -d shunshi.cn -d api.shunshi.cn
#   2. 复制本文件: cp shunshi-ssl.conf /etc/nginx/conf.d/default.conf
#   3. 测试配置: nginx -t
#   4. 重载: systemctl reload nginx

upstream backend_api {
    least_conn;
    server backend:4000 max_fails=3 fail_timeout=30s;
    # 多实例时添加:
    # server backend-2:4000 max_fails=3 fail_timeout=30s;
}

upstream admin_panel {
    server admin:3000 max_fails=3 fail_timeout=30s;
}

# HTTP → HTTPS 强制跳转
server {
    listen 80;
    listen [::]:80;
    server_name shunshi.cn api.shunshi.cn app.shunshi.cn seasons.care app.seasons.care;
    
    location /.well-known/acme-challenge/ {
        # Let's Encrypt 验证
        root /var/www/certbot;
    }
    
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS 主站点
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shunshi.cn app.shunshi.cn;

    # SSL 证书 (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/shunshi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shunshi.cn/privkey.pem;
    
    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_stapling on;
    ssl_stapling_verify on;

    # 安全响应头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.shunshi.cn;" always;

    client_max_body_size 20M;

    # API 路由 → 后端
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        # 限流: 单个 IP 每分钟最多 300 次请求
        limit_req zone=api_limit burst=50 nodelay;
        limit_req_status 429;
    }

    # 静态文件
    location /static/ {
        proxy_pass http://backend_api/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查
    location /health {
        proxy_pass http://backend_api/health;
        access_log off;
    }

    # Prometheus Metrics (仅限内网)
    location /metrics {
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://backend_api/metrics;
        access_log off;
    }

    # 隐私政策
    location /privacy {
        proxy_pass http://backend_api/static/privacy-policy.html;
    }

    # Admin 面板
    location / {
        proxy_pass http://admin_panel;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;

    # 错误页面
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}

# API 独立域名
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shunshi.cn;

    ssl_certificate /etc/letsencrypt/live/shunshi.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shunshi.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
        
        limit_req zone=api_limit burst=100 nodelay;
    }
}
