# 顺时 Nginx 网关配置
# /api/*  -> 后端 FastAPI
# /*     -> 国内用户 Web/PWA

upstream backend_api {
    server backend:4000;
}

upstream admin_panel {
    server admin:3000;
}

upstream web_cn {
    server web-cn:8080;
}

# 限流区域定义
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=300r/m;

server {
    listen 80;
    server_name admin.localhost;

    client_max_body_size 20M;

    location /api/ {
        proxy_pass http://backend_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://admin_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    # API 路由 -> 后端
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # AI 接口可能耗时较长，给予充足超时
        proxy_connect_timeout  10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # 静态资源（知识库图片、音频封面等）-> 后端
    location /static/ {
        proxy_pass http://backend_api/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # 健康检查 -> 后端
    location /health {
        proxy_pass http://backend_api/health;
        access_log off;
    }

    # Prometheus Metrics -> 后端（仅允许 Docker 内网）
    location /metrics {
        allow  10.0.0.0/8;
        allow  172.16.0.0/12;
        allow  192.168.0.0/16;
        allow  127.0.0.1;
        deny   all;
        proxy_pass http://backend_api/metrics;
        access_log off;
    }

    # 其他所有请求 -> 国内用户 Web/PWA
    location / {
        proxy_pass http://web_cn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss image/svg+xml;
}

# 生产环境 SSL 配置见 shunshi-ssl.conf
# 启用: docker compose 中将 shunshi-ssl.conf 挂载为 default.conf
