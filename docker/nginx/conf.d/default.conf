# 顺时 Nginx 网关 · 本地 / 内网 HTTP
#   /api/*、/ai/*、/static/*  → 后端 FastAPI
#   /*                         → 国内用户 Web/PWA
#   admin.localhost            → 管理后台
#
# 生产用 HTTPS 配置：在根目录 .env 里设 SHUNSHI_NGINX_SITE=shunshi-ssl.conf，
# 并按 shunshi-ssl.conf 顶部说明填好域名与证书。
# 本文件由 nginx 镜像启动时用 envsubst 渲染（只替换已定义的环境变量；$host 等不受影响）。

limit_req_zone $binary_remote_addr zone=shunshi_api:10m rate=300r/m;
limit_req_zone $binary_remote_addr zone=shunshi_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=shunshi_ai:10m rate=30r/m;
limit_req_status 429;

upstream backend_api {
    server backend:4000;
}

upstream admin_panel {
    server admin:3000;
}

upstream web_cn {
    server web-cn:8080;
}

server {
    listen 80;
    server_name admin.localhost;

    client_max_body_size 20M;

    location /api/ {
        limit_req zone=shunshi_api burst=50 nodelay;
        include /etc/nginx/snippets/proxy-backend.conf;
    }

    location / {
        proxy_pass http://admin_panel;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 20M;

    include /etc/nginx/snippets/backend-routes.conf;

    # 其他所有请求 -> 国内用户 Web/PWA
    location / {
        proxy_pass http://web_cn;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
