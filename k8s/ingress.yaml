apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: shunshi-ingress
  namespace: shunshi
  annotations:
    # Let's Encrypt 自动证书 (使用 cert-manager)
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
    - hosts:
      - shunshi.app
      - api.shunshi.app
      - admin.shunshi.app
      secretName: shunshi-tls
  ingressClassName: nginx
  rules:
    - host: shunshi.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /health
            pathType: Exact
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web-cn
                port:
                  number: 80
    - host: admin.shunshi.app
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 80
    - host: api.shunshi.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: backend
                port:
                  number: 4000
