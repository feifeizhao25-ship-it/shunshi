apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-cn
  namespace: shunshi
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: web-cn
  template:
    metadata:
      labels:
        app: web-cn
    spec:
      containers:
        - name: web-cn
          image: shunshi/web-cn:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              memory: "32Mi"
              cpu: "25m"
            limits:
              memory: "128Mi"
              cpu: "250m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 2
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: web-cn
  namespace: shunshi
spec:
  selector:
    app: web-cn
  ports:
    - name: http
      port: 80
      targetPort: 8080
