# =============================================================================
# 顺时 ShunShi — Kubernetes Secret 模板
# =============================================================================
# ⚠️  本文件是模板，部署前必须填充真实 base64 编码值。
# ⚠️  切勿将填充后的文件提交到 Git！
#
# 生成 base64 值:
#   echo -n 'your_actual_password' | base64
#
# 生产环境推荐使用 external-secrets 或 Sealed Secrets 管理。
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: shunshi-secret
  namespace: shunshi
type: Opaque
stringData:
  # 使用 stringData 而非 data，K8s 会自动 base64 编码
  # 这些值将在 apply 时注入，不会被硬编码到仓库中
  DB_PASSWORD: "${DB_PASSWORD}"
  JWT_SECRET: "${JWT_SECRET}"
  SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
  ALIPAY_APP_ID: "${ALIPAY_APP_ID}"
  ALIPAY_PRIVATE_KEY: "${ALIPAY_PRIVATE_KEY}"
  FCM_CREDENTIALS_JSON: "${FCM_CREDENTIALS_JSON}"
  APNS_KEY: "${APNS_KEY}"
  APPLE_PRIVATE_KEY: "${APPLE_PRIVATE_KEY}"
  WECHAT_APP_SECRET: "${WECHAT_APP_SECRET}"
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
---
# Sentry 错误追踪（可选）
apiVersion: v1
kind: Secret
metadata:
  name: shunshi-sentry
  namespace: shunshi
type: Opaque
stringData:
  SENTRY_DSN: "${SENTRY_DSN}"
---
