# =============================================================================
# 顺时 ShunShi — Kubernetes Secret 模板
# =============================================================================
# 本文件仅说明字段，禁止直接 apply；kubectl 不会替换 ${...}。
# 生产工作流从 GitHub Secrets 注入，真实值不得提交到 Git。
#
# 生产环境推荐使用 external-secrets 或 Sealed Secrets 管理。
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: shunshi-secret
  namespace: shunshi
type: Opaque
stringData:
  # 使用 stringData 而非 data，K8s 会自动 base64 编码
  # 以下占位符不能作为生产值。
  DB_PASSWORD: "${DB_PASSWORD}"
  SHUNSHI_DATABASE_URL: "${SHUNSHI_DATABASE_URL}"
  SHUNSHI_JWT_SECRET: "${SHUNSHI_JWT_SECRET}"
  JWT_SECRET: "${JWT_SECRET}"
  ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET}"
  ADMIN_PASSWORD_HASH: "${ADMIN_PASSWORD_HASH}"
  SILICONFLOW_API_KEY: "${SILICONFLOW_API_KEY}"
  SHUNSHI_MODEL_ROUTER_URL: "${SHUNSHI_MODEL_ROUTER_URL}"
  STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY}"
  ALIPAY_APP_ID: "${ALIPAY_APP_ID}"
  ALIPAY_SELLER_ID: "${ALIPAY_SELLER_ID}"
  ALIPAY_PRIVATE_KEY: "${ALIPAY_PRIVATE_KEY}"
  ALIPAY_PUBLIC_KEY: "${ALIPAY_PUBLIC_KEY}"
  ALIPAY_NOTIFY_URL: "${ALIPAY_NOTIFY_URL}"
  ALIPAY_RETURN_URL: "${ALIPAY_RETURN_URL}"
  ALIPAY_MODE: "production"
  FCM_CREDENTIALS_JSON: "${FCM_CREDENTIALS_JSON}"
  APNS_KEY: "${APNS_KEY}"
  APPLE_PRIVATE_KEY: "${APPLE_PRIVATE_KEY}"
  WECHAT_APP_SECRET: "${WECHAT_APP_SECRET}"
  GRAFANA_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD}"
---
# Sentry 错误追踪（可选）
apiVersion: v1
kind: Secret
metadata:
  name: shunshi-sentry
  namespace: shunshi
type: Opaque
stringData:
  SENTRY_DSN: "${SENTRY_DSN}"
---
