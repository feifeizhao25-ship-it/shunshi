# 自我改进任务（知识库到期检查、每周评测与提案、每月报告）。与 docker-compose.yml 里的
# self-improve 服务是同一个镜像、同一条命令。
#
# 默认不运行：replicas 为 0，SIL_ENABLED 为 "0"。要启用，按顺序做三件事：
#   1. 在 shunshi-secret 里填 POLICY_REVIEWERS（企业微信审批人 userid，逗号分隔）。
#      为空 = 没人能批准，所有提案 72 小时后自动作废。
#   2. 把下面的 SIL_ENABLED 改成 "1"。
#   3. kubectl -n shunshi scale deployment/self-improve --replicas=1
#
# 还差一步没有解决：每周评测要读仓库根上的「参考文档，知识库」目录（评测语料），
# 这个目录不在镜像里（镜像只 COPY app）。docker-compose 是把目录挂进容器的；
# k8s 这边启用前需要把这个目录做成卷挂到容器里，并设 SHUNSHI_KNOWLEDGE_DIR 指过去，
# 否则每周评测会报「知识库文件不存在」。每日的到期检查不受影响。
#
# 注意：它和后端共用 backend-data 这块盘（批准入库的条目写在这里，由后端读取）。
# 这块盘是 ReadWriteOnce，所以本 Pod 必须和后端 Pod 调度到同一个节点（下面的 podAffinity）。
# 只能跑 1 个副本。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: self-improve
  namespace: shunshi
  labels:
    app: self-improve
spec:
  replicas: 0
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: self-improve
  template:
    metadata:
      labels:
        app: self-improve
    spec:
      affinity:
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: backend
              topologyKey: kubernetes.io/hostname
      containers:
        - name: self-improve
          image: shunshi/backend:latest
          imagePullPolicy: Always
          command: ["python", "-m", "app.self_improve.run", "serve"]
          envFrom:
            - configMapRef:
                name: shunshi-config
            - secretRef:
                name: shunshi-secret
          env:
            - name: SIL_ENABLED
              value: "0"
            - name: SIL_AUTO_PROMOTE_INTERNAL
              value: "0"
            - name: SIL_DATA_DIR
              value: /app/data/self_improve/state
            - name: SHUNSHI_APPROVED_KB_DIR
              value: /app/data/self_improve/approved
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
      restartPolicy: Always
